<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>五十音学习</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --surface: #fffdf8;
      --surface-strong: #ffffff;
      --ink: #26231f;
      --muted: #746e65;
      --line: #dfd8ca;
      --accent: #bd4b35;
      --accent-soft: #f3dfd8;
      --shadow: 0 14px 34px rgb(62 48 34 / 9%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 5%, rgb(189 75 53 / 10%), transparent 28rem),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 42rem);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        1rem
        max(1.5rem, env(safe-area-inset-bottom));
    }

    .masthead {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP",
        serif;
      font-size: clamp(2.1rem, 10vw, 3.6rem);
      font-weight: 650;
      letter-spacing: -0.04em;
      line-height: 1.08;
    }

    .subtitle {
      max-width: 34rem;
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    [hidden] {
      display: none !important;
    }

    .app-controls {
      display: grid;
      gap: 0.7rem;
      margin-bottom: 0.9rem;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.3rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
    }

    .mode-button {
      min-height: 2.7rem;
      padding: 0.45rem 0.5rem;
      border: 0;
      border-radius: 0.75rem;
      color: var(--muted);
      background: transparent;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .mode-button[aria-selected="true"] {
      color: var(--surface-strong);
      background: var(--ink);
    }

    .chart-card {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 1.3rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .chart-title {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .chart-subtitle {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .script-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
      background: #ebe5da;
    }

    .script-button {
      min-height: 2.5rem;
      padding: 0.4rem 0.8rem;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: 0.82rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .script-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: 0 2px 8px rgb(51 43 33 / 12%);
    }

    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.42rem;
    }

    .kana-button,
    .kana-gap {
      min-width: 0;
      min-height: clamp(3.25rem, 14vw, 4.25rem);
      border-radius: 0.85rem;
    }

    .kana-button {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--surface-strong);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP",
        sans-serif;
      font-size: clamp(1.55rem, 7vw, 2.1rem);
      font-weight: 650;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .kana-button.is-mastered {
      border-color: #8bb599;
      background: #f0f7f2;
    }

    .kana-button.is-weak {
      border-color: #d89b8d;
      background: #fff7f4;
    }

    .kana-button.is-mastered::after,
    .kana-button.is-weak::after {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      content: "";
    }

    .kana-button.is-mastered::after {
      background: #4d8160;
    }

    .kana-button.is-weak::after {
      background: var(--accent);
    }

    .kana-button:active {
      transform: translateY(1px);
      background: var(--accent-soft);
    }

    .kana-button.is-playing {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgb(189 75 53 / 14%);
    }

    .kana-button:focus-visible,
    .script-button:focus-visible {
      outline: 3px solid rgb(189 75 53 / 35%);
      outline-offset: 2px;
    }

    .kana-gap {
      visibility: hidden;
      pointer-events: none;
    }

    .chart-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    .study-panel {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 1.3rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .panel-title {
      margin: 0;
      font-size: 1.15rem;
    }

    .panel-meta {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .card-counter {
      flex: 0 0 auto;
      margin: 0;
      padding: 0.32rem 0.65rem;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .kana-card {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: min(58vw, 20rem);
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      color: var(--ink);
      background:
        linear-gradient(145deg, rgb(255 255 255 / 80%), transparent),
        var(--surface-strong);
      cursor: pointer;
      touch-action: manipulation;
    }

    .card-face {
      display: grid;
      place-items: center;
      gap: 0.3rem;
      width: 100%;
    }

    .card-kana {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP",
        sans-serif;
      font-size: clamp(5.4rem, 28vw, 9rem);
      font-weight: 600;
      line-height: 1;
    }

    .card-prompt {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .card-romaji {
      color: var(--accent);
      font-size: clamp(2rem, 12vw, 3.3rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .card-example {
      font-size: clamp(1.3rem, 7vw, 2rem);
      font-weight: 750;
    }

    .card-meaning {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .answer-button,
    .next-button,
    .restart-button {
      min-height: 3rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .answer-button[data-card-answer="known"] {
      color: var(--surface-strong);
      background: #3f6950;
      border-color: #3f6950;
    }

    .answer-button[data-card-answer="unknown"] {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: #e4bfb5;
    }

    .card-summary {
      display: grid;
      gap: 0.9rem;
      padding: 1.2rem;
      border-radius: 1rem;
      background: var(--surface-strong);
      text-align: center;
    }

    .card-summary h3,
    .card-summary p {
      margin: 0;
    }

    .quiz-score {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .queue-refresh {
      min-height: 2.7rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid #d9c5bd;
      border-radius: 0.8rem;
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .queue-progress {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .queue-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .queue-tile {
      display: grid;
      gap: 0.55rem;
      min-width: 0;
      padding: 0.6rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface-strong);
    }

    .queue-tile.is-answered {
      border-color: #b9c8bd;
      background: #f3f7f3;
    }

    .queue-tile:last-child {
      grid-column: 1 / -1;
    }

    .queue-flip {
      display: grid;
      place-items: center;
      gap: 0.25rem;
      min-height: 8.5rem;
      padding: 0.7rem;
      border: 0;
      border-radius: 0.75rem;
      color: var(--ink);
      background: #f7f2e9;
      cursor: pointer;
      touch-action: manipulation;
    }

    .queue-kana {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP",
        sans-serif;
      font-size: clamp(2.6rem, 14vw, 4.1rem);
      font-weight: 650;
      line-height: 1;
    }

    .queue-prompt {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .queue-back {
      display: grid;
      place-items: center;
      gap: 0.25rem;
    }

    .queue-romaji {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .queue-example {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .queue-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }

    .queue-actions button {
      min-height: 2.5rem;
      padding: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      background: var(--surface-strong);
      font-size: 0.75rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .queue-actions [data-queue-answer="known"] {
      color: #28543a;
      border-color: #9bbca6;
      background: #e9f4ec;
    }

    .queue-actions [data-queue-answer="unknown"] {
      color: var(--accent);
      border-color: #e2b2a7;
      background: #fbece7;
    }

    .queue-answer-note {
      margin: 0;
      padding: 0.3rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }

    .quiz-prompt {
      display: grid;
      place-items: center;
      min-height: min(45vw, 15rem);
      padding: 1rem;
      border-radius: 1.2rem;
      background: var(--surface-strong);
      border: 1px solid var(--line);
    }

    .quiz-kana {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP",
        sans-serif;
      font-size: clamp(4.8rem, 24vw, 7.5rem);
      font-weight: 600;
      line-height: 1;
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .quiz-choice {
      min-height: 3.3rem;
      padding: 0.65rem;
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      color: var(--ink);
      background: var(--surface-strong);
      font-size: 1.05rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .quiz-choice.is-correct {
      color: #214c31;
      border-color: #659875;
      background: #e4f1e7;
    }

    .quiz-choice.is-wrong {
      color: #7d2719;
      border-color: #c47768;
      background: #f6ded8;
    }

    .quiz-choice:disabled {
      cursor: default;
      opacity: 1;
    }

    .quiz-feedback {
      min-height: 1.6rem;
      margin: 0;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .next-button {
      width: 100%;
      color: var(--surface-strong);
      background: var(--ink);
      border-color: var(--ink);
    }

    .restart-button {
      color: var(--surface-strong);
      background: var(--ink);
      border-color: var(--ink);
    }

    .mode-button:focus-visible,
    .kana-card:focus-visible,
    .quiz-choice:focus-visible,
    .queue-refresh:focus-visible,
    .queue-flip:focus-visible,
    .queue-actions button:focus-visible,
    .answer-button:focus-visible,
    .next-button:focus-visible,
    .restart-button:focus-visible {
      outline: 3px solid rgb(189 75 53 / 35%);
      outline-offset: 2px;
    }

    @media (max-width: 22rem) {
      .chart-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .script-switch {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <p class="eyebrow">Kana practice</p>
      <h1>五十音学习</h1>
      <p class="subtitle">从基础清音开始，在一个轻量的手机页面里认读、测验和复习。</p>
    </header>

    <div class="app-controls">
      <div class="script-switch" role="group" aria-label="切换假名文字">
        <button class="script-button" type="button" data-script-toggle="hiragana" aria-pressed="true">
          平假名
        </button>
        <button class="script-button" type="button" data-script-toggle="katakana" aria-pressed="false">
          片假名
        </button>
      </div>
      <nav class="mode-switch" role="tablist" aria-label="学习模式">
        <button class="mode-button" type="button" role="tab" data-mode="chart" aria-selected="true">
          图表
        </button>
        <button class="mode-button" type="button" role="tab" data-mode="queue" aria-selected="false">
          队列
        </button>
        <button class="mode-button" type="button" role="tab" data-mode="card" aria-selected="false">
          卡片
        </button>
        <button class="mode-button" type="button" role="tab" data-mode="quiz" aria-selected="false">
          测验
        </button>
      </nav>
    </div>

    <section class="chart-card" id="chart-panel" aria-labelledby="chart-title">
      <div class="chart-toolbar">
        <div>
          <h2 class="chart-title" id="chart-title">平假名</h2>
          <p class="chart-subtitle">46 个基础清音</p>
        </div>
      </div>
      <div class="kana-grid" id="kana-grid"></div>
      <p class="chart-note">按照五十音顺序排列，空缺位置对应传统五十音表。</p>
    </section>

    <section class="study-panel" id="queue-panel" data-script="hiragana" aria-labelledby="queue-title" hidden>
      <div class="panel-heading">
        <div>
          <h2 class="panel-title" id="queue-title">队列学习</h2>
          <p class="panel-meta">每轮 5 个 · 优先抽取已经认出的假名</p>
        </div>
        <button class="queue-refresh" id="queue-refresh" type="button">刷新 5 个</button>
      </div>
      <p class="queue-progress" id="queue-progress">本轮已判断 0 / 5</p>
      <div class="queue-grid" id="queue-grid"></div>
    </section>

    <section class="study-panel" id="card-panel" aria-labelledby="card-title" hidden>
      <div class="panel-heading">
        <div>
          <h2 class="panel-title" id="card-title">学习卡片</h2>
          <p class="panel-meta">先凭记忆认读，再点击翻面确认。</p>
        </div>
        <p class="card-counter" id="card-counter">1 / 46</p>
      </div>
      <button class="kana-card" id="card-button" type="button" aria-expanded="false" aria-label="点击翻面查看答案">
        <span class="card-face" id="card-front">
          <span class="card-kana" id="card-kana"></span>
          <span class="card-prompt">点击翻面</span>
        </span>
        <span class="card-face" id="card-back" hidden>
          <span class="card-romaji" id="card-romaji"></span>
          <span class="card-example" id="card-example"></span>
          <span class="card-meaning" id="card-meaning"></span>
        </span>
      </button>
      <div class="card-actions" id="card-actions" hidden>
        <button class="answer-button" type="button" data-card-answer="known">认识</button>
        <button class="answer-button" type="button" data-card-answer="unknown">不认识</button>
      </div>
      <div class="card-summary" id="card-summary" hidden>
        <h3>本轮完成</h3>
        <p id="card-summary-text"></p>
        <button class="restart-button" id="restart-cards" type="button">再来一轮</button>
      </div>
    </section>

    <section class="study-panel" id="quiz-panel" data-script="hiragana" aria-labelledby="quiz-title" hidden>
      <div class="panel-heading">
        <div>
          <h2 class="panel-title" id="quiz-title">读音测验</h2>
          <p class="panel-meta">看假名，选择正确的罗马音。</p>
        </div>
        <p class="quiz-score" id="quiz-score">正确 0 / 0</p>
      </div>
      <div class="quiz-prompt">
        <span class="quiz-kana" id="quiz-kana"></span>
      </div>
      <div class="quiz-choices" id="quiz-choices"></div>
      <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>
      <button class="next-button" id="quiz-next" type="button" hidden>下一题</button>
    </section>
  </main>

    function createCardProgress() {
      return {
        seen: 0,
        correct: 0,
        wrong: 0,
        streak: 0,
        stage: 0,
        dueAt: null,
        weak: false,
        mastered: false,
      };
    }

    function getCardKey(script, romaji) {
      return `${script}:${romaji}`;
    }

    function createInitialState() {
      const cards = {};

      for (const item of KANA) {
        cards[getCardKey("hiragana", item.romaji)] = createCardProgress();
        cards[getCardKey("katakana", item.romaji)] = createCardProgress();
      }

      return {
        version: 1,
        cards,
        stats: {
          quizAnswered: 0,
          quizCorrect: 0,
        },
        prefs: {
          script: "hiragana",
          mode: "chart",
        },
      };

    const CHART_LAYOUT = [
      ["a", "i", "u", "e", "o"],
      ["ka", "ki", "ku", "ke", "ko"],
      ["sa", "shi", "su", "se", "so"],
      ["ta", "chi", "tsu", "te", "to"],
      ["na", "ni", "nu", "ne", "no"],
      ["ha", "hi", "fu", "he", "ho"],
      ["ma", "mi", "mu", "me", "mo"],
      ["ya", null, "yu", null, "yo"],
      ["ra", "ri", "ru", "re", "ro"],
      ["wa", null, null, null, "wo"],
      ["n", null, null, null, null],
    ];

    function getChartRows(script) {
      if (script !== "hiragana" && script !== "katakana") {
        throw new RangeError(`Unsupported script: ${script}`);
      }

      const byRomaji = new Map(KANA.map((item) => [item.romaji, item]));
      return CHART_LAYOUT.map((row) =>
        row.map((romaji) => (romaji ? byRomaji.get(romaji) : null)),
      );
    }

    function getAudioData(romaji) {
      return AUDIO_DATA[romaji] || "";
    }

    function shuffle(items, rng = Math.random) {
      const result = items.slice();
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(rng() * (index + 1));
        [result[index], result[swapIndex]] = [
          result[swapIndex],
          result[index],
        ];
      }
      return result;
    }

    function createQuizChoices(correctRomaji, rng = Math.random) {
      const distractors = shuffle(
        KANA.map((item) => item.romaji).filter(
          (romaji) => romaji !== correctRomaji,
        ),
        rng,
      ).slice(0, 3);
      return shuffle([correctRomaji, ...distractors], rng);
    }

      if (correct) {
        card.correct += 1;
        card.streak += 1;
        card.stage = Math.min(card.stage + 1, REVIEW_INTERVALS.length);
        card.dueAt = now + REVIEW_INTERVALS[card.stage - 1] * DAY_MS;
        if (card.streak >= 3) {
          card.mastered = true;
        }
        if (card.streak >= 2) {
          card.weak = false;
        }
      } else {
        card.wrong += 1;
        card.streak = 0;
        card.stage = 0;
        card.dueAt = now;
        card.weak = true;
        card.mastered = false;
      }

      return card;
    }

    function getPracticePriority(card, now) {
      if (card.dueAt !== null && card.dueAt <= now) {
        return 0;
      }
      if (card.weak) {
        return 1;
      }
      if (card.seen === 0) {
        return 2;
      }
      if (!card.mastered) {
        return 3;
      }
      return 4;
    }

    function getPracticeOrder(state, script, now = Date.now()) {
      return KANA.map((item, index) => ({
        item,
        index,
        priority: getPracticePriority(
          state.cards[getCardKey(script, item.romaji)],
          now,
        ),
      }))
        .sort(
          (left, right) =>
            left.priority - right.priority || left.index - right.index,
        )
        .map((entry) => entry.item);
    }

    function chooseQuizItem(
      state,
      script,
      now = Date.now(),
      rng = Math.random,
    ) {
      const order = getPracticeOrder(state, script, now);
      const bestPriority = getPracticePriority(
        state.cards[getCardKey(script, order[0].romaji)],
        now,
      );
      const group = order.filter(
        (item) =>
          getPracticePriority(
            state.cards[getCardKey(script, item.romaji)],
            now,
          ) === bestPriority,
      );
      return group[Math.floor(rng() * group.length)];
    }

    function selectQueueBatch(
      state,
      script,
      count = 5,
      now = Date.now(),
      rng = Math.random,
    ) {
      const entries = KANA.map((item, index) => ({
        item,
        index,
        recognized:
          state.cards[getCardKey(script, item.romaji)].correct > 0,
        priority: getPracticePriority(
          state.cards[getCardKey(script, item.romaji)],
          now,
        ),
      }));
      const choose = (pool, amount) =>
        shuffle(pool, rng)
          .sort(
            (left, right) =>
              left.priority - right.priority || left.index - right.index,
          )
          .slice(0, amount);

      const recognized = entries.filter((entry) => entry.recognized);
      const selected = choose(recognized, count);

      if (selected.length < count) {
        selected.push(
          ...choose(
            entries.filter((entry) => !entry.recognized),
            count - selected.length,
          ),
        );
      }

      return shuffle(selected, rng).map((entry) => entry.item);
    }

    function normalizeState(candidate) {
      const initial = createInitialState();

      if (!candidate || typeof candidate !== "object" || candidate.version !== 1) {
        return initial;
      }

      const cards = {};
      for (const key of Object.keys(initial.cards)) {
        const saved = candidate.cards && candidate.cards[key];
        cards[key] = {
          ...initial.cards[key],
          ...(saved && typeof saved === "object" ? saved : {}),
        };
      }

      return {
        version: 1,
        cards,
        stats: {
          ...initial.stats,
          ...(candidate.stats && typeof candidate.stats === "object"
            ? candidate.stats
            : {}),
        },
        prefs: {
          ...initial.prefs,
          ...(candidate.prefs && typeof candidate.prefs === "object"
            ? candidate.prefs
            : {}),
        },
      };
    }

    function loadState(storage = globalThis.localStorage) {
      try {
        const saved = storage && storage.getItem(STORAGE_KEY);
        return saved ? normalizeState(JSON.parse(saved)) : createInitialState();
      } catch {
        return createInitialState();
      }
    }

    function saveState(state, storage = globalThis.localStorage) {
      try {
        if (!storage) {
          return false;
        }
        storage.setItem(STORAGE_KEY, JSON.stringify(normalizeState(state)));
        return true;
      } catch {
        return false;
      }
    }

    globalThis.KanaCore = {
      STORAGE_KEY,
      KANA,
      createCardProgress,
      getCardKey,
      createInitialState,
      getChartRows,
      getAudioData,
      createQuizChoices,
      recordAnswer,
      getPracticePriority,
      getPracticeOrder,
      chooseQuizItem,
      selectQueueBatch,
      normalizeState,
      loadState,
      saveState,
    };
    /* CORE_END */

    const appState = KanaCore.loadState();
    const kanaAudio = new Audio();
    kanaAudio.preload = "auto";
    const chartTitle = document.querySelector("#chart-title");
    const kanaGrid = document.querySelector("#kana-grid");
    const scriptButtons = Array.from(
      document.querySelectorAll("[data-script-toggle]"),
    );
    const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
    const chartPanel = document.querySelector("#chart-panel");
    const queuePanel = document.querySelector("#queue-panel");
    const queueGrid = document.querySelector("#queue-grid");
    const queueRefresh = document.querySelector("#queue-refresh");
    const queueProgress = document.querySelector("#queue-progress");
    const cardPanel = document.querySelector("#card-panel");
    const quizPanel = document.querySelector("#quiz-panel");
    const quizKana = document.querySelector("#quiz-kana");
    const quizChoices = document.querySelector("#quiz-choices");
    const quizFeedback = document.querySelector("#quiz-feedback");
    const quizNext = document.querySelector("#quiz-next");
    const quizScore = document.querySelector("#quiz-score");
    const cardButton = document.querySelector("#card-button");
    const cardFront = document.querySelector("#card-front");
    const cardBack = document.querySelector("#card-back");
    const cardKana = document.querySelector("#card-kana");
    const cardRomaji = document.querySelector("#card-romaji");
    const cardExample = document.querySelector("#card-example");
    const cardMeaning = document.querySelector("#card-meaning");
    const cardActions = document.querySelector("#card-actions");
    const cardCounter = document.querySelector("#card-counter");
    const cardSummary = document.querySelector("#card-summary");
    const cardSummaryText = document.querySelector("#card-summary-text");
    const answerButtons = Array.from(
      document.querySelectorAll("[data-card-answer]"),
    );
    const restartCardsButton = document.querySelector("#restart-cards");

    let cardDeck = [];
    let cardIndex = 0;
    let cardFlipped = false;
    let sessionKnown = 0;
    let sessionUnknown = 0;
    let quizItem = null;
    let quizAnswered = false;
    let queueBatch = [];
    let queueAnswered = 0;

    function playKana(romaji, button) {
      const audioData = KanaCore.getAudioData(romaji);
      if (!audioData) {
        return;
      }

      kanaAudio.pause();
      kanaAudio.src = audioData;
      kanaAudio.currentTime = 0;

      const playResult = kanaAudio.play();
      if (playResult && typeof playResult.catch === "function") {
        playResult.catch(() => {});
      }

      button.classList.add("is-playing");
      window.setTimeout(() => button.classList.remove("is-playing"), 420);
    }

    function renderChart() {
      const script = appState.prefs.script;
      chartTitle.textContent = script === "hiragana" ? "平假名" : "片假名";

      for (const button of scriptButtons) {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.scriptToggle === script),
        );
      }

      kanaGrid.replaceChildren();

      for (const row of KanaCore.getChartRows(script)) {
        for (const item of row) {
          if (!item) {
            const gap = document.createElement("span");
            gap.className = "kana-gap";
            gap.setAttribute("aria-hidden", "true");
            kanaGrid.append(gap);
            continue;
          }

          const button = document.createElement("button");
          button.type = "button";
          button.className = "kana-button";
          button.dataset.romaji = item.romaji;
          button.dataset.script = script;
          button.textContent = item[script];
          const progress = appState.cards[
            KanaCore.getCardKey(script, item.romaji)
          ];
          button.classList.toggle("is-mastered", progress.mastered);
          button.classList.toggle("is-weak", progress.weak);
          button.setAttribute(
            "aria-label",
            `${item[script]}，读作 ${item.romaji}`,
          );
          button.addEventListener("click", () => playKana(item.romaji, button));
          kanaGrid.append(button);
        }
      }
    }

    function startQueueBatch() {
      queueBatch = KanaCore.selectQueueBatch(
        appState,
        appState.prefs.script,
        5,
        Date.now(),
      );
      queueAnswered = 0;
      renderQueue();
    }

    function renderQueue() {
      const script = appState.prefs.script;
      queuePanel.dataset.script = script;
      queueProgress.textContent =
        `本轮已判断 ${queueAnswered} / ${queueBatch.length}`;
      queueGrid.replaceChildren();

      for (const item of queueBatch) {
        const tile = document.createElement("article");
        tile.className = "queue-tile";
        tile.dataset.romaji = item.romaji;

        const flipButton = document.createElement("button");
        flipButton.type = "button";
        flipButton.className = "queue-flip";
        flipButton.setAttribute("aria-expanded", "false");
        flipButton.setAttribute(
          "aria-label",
          `${item[script]}，点击辨认`,
        );

        const kana = document.createElement("span");
        kana.className = "queue-kana";
        kana.textContent = item[script];

        const prompt = document.createElement("span");
        prompt.className = "queue-prompt";
        prompt.textContent = "点击辨认";

        const back = document.createElement("span");
        back.className = "queue-back";
        back.hidden = true;

        const romaji = document.createElement("span");
        romaji.className = "queue-romaji";
        romaji.textContent = item.romaji;

        const example = document.createElement("span");
        example.className = "queue-example";
        example.textContent = item.example[script];

        back.append(romaji, example);
        flipButton.append(kana, prompt, back);

        const actions = document.createElement("div");
        actions.className = "queue-actions";
        actions.hidden = true;

        for (const [value, label] of [
          ["known", "认出"],
          ["unknown", "没认出"],
        ]) {
          const answerButton = document.createElement("button");
          answerButton.type = "button";
          answerButton.dataset.queueAnswer = value;
          answerButton.textContent = label;
          answerButton.addEventListener("click", () => {
            if (tile.dataset.answered === "true") {
              return;
            }

            KanaCore.recordAnswer(
              appState,
              script,
              item.romaji,
              value === "known",
              Date.now(),
            );
            KanaCore.saveState(appState);
            renderChart();

            tile.dataset.answered = "true";
            tile.classList.add("is-answered");
            for (const button of actions.querySelectorAll("button")) {
              button.disabled = true;
            }
            queueAnswered += 1;
            queueProgress.textContent =
              `本轮已判断 ${queueAnswered} / ${queueBatch.length}`;
          });
          actions.append(answerButton);
        }

        const answerNote = document.createElement("p");
        answerNote.className = "queue-answer-note";
        answerNote.textContent = "选择后记录到复习进度";

        flipButton.addEventListener("click", () => {
          back.hidden = false;
          prompt.hidden = true;
          actions.hidden = false;
          flipButton.setAttribute("aria-expanded", "true");
          flipButton.setAttribute("aria-label", `${item[script]}的答案`);
        });

        tile.append(flipButton, actions, answerNote);
        queueGrid.append(tile);
      }
    }

    function startCardDeck() {
      cardDeck = KanaCore.getPracticeOrder(
        appState,
        appState.prefs.script,
        Date.now(),
      );
      cardIndex = 0;
      sessionKnown = 0;
      sessionUnknown = 0;
      renderCard();
    }

    function renderCard() {
      const finished = cardIndex >= cardDeck.length;
      cardButton.hidden = finished;
      cardActions.hidden = true;
      cardSummary.hidden = !finished;

      if (finished) {
        cardCounter.textContent = `${cardDeck.length} / ${cardDeck.length}`;
        cardSummaryText.textContent =
          `认识 ${sessionKnown} 个，不认识 ${sessionUnknown} 个。`;
        return;
      }

      const item = cardDeck[cardIndex];
      const script = appState.prefs.script;
      cardFlipped = false;
      cardFront.hidden = false;
      cardBack.hidden = true;
      cardButton.setAttribute("aria-expanded", "false");
      cardButton.setAttribute(
        "aria-label",
        `${item[script]}，点击翻面查看答案`,
      );
      cardKana.textContent = item[script];
      cardRomaji.textContent = item.romaji;
      cardExample.textContent = item.example[script];
      cardMeaning.textContent = item.example.meaning;
      cardCounter.textContent = `${cardIndex + 1} / ${cardDeck.length}`;
    }

    function flipCard() {
      if (cardFlipped || cardIndex >= cardDeck.length) {
        return;
      }

      cardFlipped = true;
      cardFront.hidden = true;
      cardBack.hidden = false;
      cardActions.hidden = false;
      cardButton.setAttribute("aria-expanded", "true");
      cardButton.setAttribute("aria-label", "答案已显示");
    }

    function markCard(known) {
      if (!cardFlipped || cardIndex >= cardDeck.length) {
        return;
      }

      const item = cardDeck[cardIndex];
      KanaCore.recordAnswer(
        appState,
        appState.prefs.script,
        item.romaji,
        known,
        Date.now(),
      );
      if (known) {
        sessionKnown += 1;
      } else {
        sessionUnknown += 1;
      }

      KanaCore.saveState(appState);
      renderChart();
      cardIndex += 1;
      renderCard();
    }

    function startQuizQuestion() {
      quizItem = KanaCore.chooseQuizItem(
        appState,
        appState.prefs.script,
        Date.now(),
      );
      quizAnswered = false;
      quizPanel.dataset.script = appState.prefs.script;
      quizKana.textContent = quizItem[appState.prefs.script];
      quizFeedback.textContent = "";
      quizNext.hidden = true;
      quizScore.textContent =
        `正确 ${appState.stats.quizCorrect} / ${appState.stats.quizAnswered}`;
      quizChoices.replaceChildren();

      for (const romaji of KanaCore.createQuizChoices(quizItem.romaji)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quiz-choice";
        button.dataset.romaji = romaji;
        button.textContent = romaji;
        button.addEventListener("click", () => answerQuiz(romaji, button));
        quizChoices.append(button);
      }
    }

    function answerQuiz(selectedRomaji, selectedButton) {
      if (quizAnswered || !quizItem) {
        return;
      }

      quizAnswered = true;
      const correct = selectedRomaji === quizItem.romaji;
      KanaCore.recordAnswer(
        appState,
        appState.prefs.script,
        quizItem.romaji,
        correct,
        Date.now(),
      );
      appState.stats.quizAnswered += 1;

      if (correct) {
        appState.stats.quizCorrect += 1;
        quizFeedback.textContent = "回答正确";
      } else {
        selectedButton.classList.add("is-wrong");
        quizFeedback.textContent =
          `回答错误，正确答案是 ${quizItem.romaji}`;
      }

      for (const button of quizChoices.querySelectorAll(".quiz-choice")) {
        button.disabled = true;
        if (button.dataset.romaji === quizItem.romaji) {
          button.classList.add("is-correct");
        }
      }

      quizScore.textContent =
        `正确 ${appState.stats.quizCorrect} / ${appState.stats.quizAnswered}`;
      quizNext.hidden = false;
      KanaCore.saveState(appState);
      renderChart();
    }

    function renderMode() {
      const validModes = ["chart", "queue", "card", "quiz"];
      const mode = validModes.includes(appState.prefs.mode)
        ? appState.prefs.mode
        : "chart";

      appState.prefs.mode = mode;
      chartPanel.hidden = mode !== "chart";
      queuePanel.hidden = mode !== "queue";
      cardPanel.hidden = mode !== "card";
      quizPanel.hidden = mode !== "quiz";

      for (const button of modeButtons) {
        button.setAttribute(
          "aria-selected",
          String(button.dataset.mode === mode),
        );
      }

      if (mode === "queue" && queueBatch.length === 0) {
        startQueueBatch();
      } else if (mode === "card" && cardDeck.length === 0) {
        startCardDeck();
      } else if (mode === "quiz" && !quizItem) {
        startQuizQuestion();
      }
    }

    cardButton.addEventListener("click", flipCard);
    restartCardsButton.addEventListener("click", startCardDeck);
    queueRefresh.addEventListener("click", startQueueBatch);
    quizNext.addEventListener("click", startQuizQuestion);

    for (const button of answerButtons) {
      button.addEventListener("click", () => {
        markCard(button.dataset.cardAnswer === "known");
      });
    }

    for (const button of modeButtons) {
      button.addEventListener("click", () => {
        appState.prefs.mode = button.dataset.mode;
        KanaCore.saveState(appState);
        renderMode();
      });
    }

    for (const button of scriptButtons) {
      button.addEventListener("click", () => {
        appState.prefs.script = button.dataset.scriptToggle;
        KanaCore.saveState(appState);
        renderChart();
        if (appState.prefs.mode === "queue") {
          startQueueBatch();
        }
        if (cardDeck.length > 0) {
          startCardDeck();
        }
        if (appState.prefs.mode === "quiz") {
          startQuizQuestion();
        }
      });
    }

    renderChart();
    renderMode();
    KanaCore.saveState(appState);
  </script>
</body>
</html>
